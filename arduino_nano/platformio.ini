; Arduino Nano Every PlatformIO project (open arduino_nano as project folder).
; Exactly one build environment: definitive TCA0 hardware PWM Gray D7,
; with buffered EDGE_US records and post-acquisition USB FRAME dump.
; Historical 5Hz/software-timed variants have been removed.
[platformio]
default_envs = nano_every_10hz_hardware_timer
src_dir = src

[env:nano_every_10hz_hardware_timer]
platform = atmelmegaavr
board = nano_every
framework = arduino
monitor_speed = 115200
