; PlatformIO project for the Arduino Nano Every Gray timecode reference.
; Mirrors the independent project layout of adafruit_feather_m4/.
[env:nano_every]
platform = atmelmegaavr
board = nano_every
framework = arduino
monitor_speed = 115200

; Experimental clock-only comparison. Never silently changes original 10Hz.
[env:nano_every_5hz_deferred]
platform = atmelmegaavr
board = nano_every
framework = arduino
monitor_speed = 115200
build_flags = -DGRAY_SLOW_DEFERRED=1
