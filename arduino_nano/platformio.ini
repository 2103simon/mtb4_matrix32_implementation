; Select ONLY one default target when VS Code PlatformIO toolbar Upload is used.
; Other environments remain available through Project Tasks explicitly.
[platformio]
default_envs = nano_every_10hz_buffered

; PlatformIO project for the Arduino Nano Every Gray timecode reference.
; Mirrors the independent project layout of adafruit_feather_m4/.
[env:nano_every]
platform = atmelmegaavr
board = nano_every
framework = arduino
monitor_speed = 115200

; Experimental clock-only comparison. Never silently changes original 10Hz.
[env:nano_every_5hz_deferred]
platform = atmelmegaavr
board = nano_every
framework = arduino
monitor_speed = 115200
build_flags = -DGRAY_SLOW_DEFERRED=1

; Experimental 10Hz: no FRAME serial printing during scope acquisition.
; Store at most 256 observed edge timestamps in Nano SRAM, then dump later.
[env:nano_every_10hz_buffered]
platform = atmelmegaavr
board = nano_every
framework = arduino
monitor_speed = 115200
build_flags = -DGRAY_BUFFERED_V1=1
