# Dedicated CH1-only stimulation settings for run_tactile_stimulation.py.
# ZERO current/width are intentional placeholders. The --arm command refuses
# to enable stimulation until these are deliberately set to approved bench
# experiment values and reviewed with an oscilloscope.
#
# Manufacturer current scale: 100 = 1 mA. Pulse widths are microseconds.
# Do not reuse multi-channel config/stim_config.yaml.
sa: [1]
sc: [0]       # REQUIRED: set CH1 current per approved bench protocol
sw: [0]       # REQUIRED: set CH1 pulse width in microseconds
sf: 20        # initial placeholder; matched to live tactile input before START
pw: 50
st: 10
sv: 50        # verify voltage per approved bench protocol
