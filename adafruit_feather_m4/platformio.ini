[env:adafruit_feather_m4_can]
platform = atmelsam
board = adafruit_feather_m4_can
framework = arduino
lib_deps = 
	adafruit/Adafruit NeoPixel@^1.15.2
	adafruit/Adafruit CAN@^0.2.3
	adafruit/Adafruit TinyUSB Library@1.18.4
	frankboesing/FastCRC@^1.4
